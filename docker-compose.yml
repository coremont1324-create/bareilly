# Local production-like stack: `docker compose up --build`, then seed once:
#   docker compose run --rm app node server/dist/scripts/seed.js
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mandal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: mandal_portal
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandal -d mandal_portal"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mandal:${POSTGRES_PASSWORD:-change-me-locally}@db:5432/mandal_portal
      PUBLIC_BASE_URL: http://localhost:4000
      COOKIE_SECURE: "false"
      TRUST_PROXY: "false"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "4000:4000"
volumes:
  pgdata:
